suite: metallb speaker daemonset resources, probes and frr per cluster
release:
  name: metallb
templates:
- charts/metallb/templates/speaker.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local cluster snapshot
  asserts:
  - matchSnapshot: {}
  values: &localValues
  - ../values-local.yaml
- it: matches the development cluster snapshot
  asserts:
  - matchSnapshot: {}
  values: &devValues
  - ../values-development.yaml
- it: matches the production cluster snapshot
  asserts:
  - matchSnapshot: {}
  values: &prodValues
  - ../values-production.yaml
- it: sets zero cpu and memory requests for the speaker on the local cluster
  values: *localValues
  documentSelector: &daemonSetSelector
    path: kind
    value: DaemonSet
  asserts:
  - matchRegex:
      path: kind
      pattern: DaemonSet
  - matchRegex:
      path: &cpuLimitsPath spec.template.spec.containers[?(@.name=="speaker")].resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits
      pattern: &localCpuPattern "^0(m)?$"
  - matchRegex:
      path: &memoryLimitsPath spec.template.spec.containers[?(@.name=="speaker")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: &nonZeroMemoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: &requestsCpuPath spec.template.spec.containers[?(@.name=="speaker")].resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests
      pattern: *localCpuPattern
  - matchRegex:
      path: &requestsMemoryPath spec.template.spec.containers[?(@.name=="speaker")].resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests
      pattern: "^0(Ki|Mi|Gi)?$"

- it: sets non-zero cpu and memory resources for the speaker on the development cluster
  values: *devValues
  documentSelector: *daemonSetSelector
  asserts: &externalSecretsResourcesAsserts
  - matchRegex:
      path: *cpuLimitsPath
      # on non local cluster we expect >= 1m cpu limits
      pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: *memoryLimitsPath
      # on non local cluster we expect non 0 memory limits
      pattern: *nonZeroMemoryPattern
  - matchRegex:
      path: *requestsCpuPath
      # on non local cluster we expect  >= 1m cpu requests
      pattern: *cpuPattern
  - matchRegex:
      path: *requestsMemoryPath
      # on non local cluster we expect non 0 memory requests
      pattern: *nonZeroMemoryPattern

- it: sets non-zero cpu and memory resources for the speaker on the production cluster
  values: *prodValues
  documentSelector: *daemonSetSelector
  asserts: *externalSecretsResourcesAsserts

- it: sets the speaker liveness probe timeout to 3 seconds on the local cluster
  values: *localValues
  documentSelector: *daemonSetSelector
  asserts: &livenessProbeTimeoutAsserts
  - equal:
      path: spec.template.spec.containers[?(@.name=="speaker")].livenessProbe.timeoutSeconds
      value: 3

- it: sets the speaker liveness probe timeout to 3 seconds on the development cluster
  values: *devValues
  documentSelector: *daemonSetSelector
  asserts: *livenessProbeTimeoutAsserts

- it: sets the speaker liveness probe timeout to 3 seconds on the production cluster
  values: *prodValues
  documentSelector: *daemonSetSelector
  asserts: *livenessProbeTimeoutAsserts

- it: sets the speaker readiness probe timeout to 3 seconds on the local cluster
  values: *localValues
  documentSelector: *daemonSetSelector
  asserts: &readinessProbeTimeoutAsserts
  - equal:
      path: spec.template.spec.containers[?(@.name=="speaker")].readinessProbe.timeoutSeconds
      value: 3

- it: sets the speaker readiness probe timeout to 3 seconds on the development cluster
  values: *devValues
  documentSelector: *daemonSetSelector
  asserts: *readinessProbeTimeoutAsserts

- it: sets the speaker readiness probe timeout to 3 seconds on the production cluster
  values: *prodValues
  documentSelector: *daemonSetSelector
  asserts: *readinessProbeTimeoutAsserts

- it: omits the frr container for l2 load balancing on the local cluster
  values: *localValues
  documentSelector: *daemonSetSelector
  asserts: &frrDisabledAsserts
  - notExists:
      path: spec.template.spec.containers[?(@.name=="frr")]

- it: omits the frr container for l2 load balancing on the development cluster
  values: *devValues
  documentSelector: *daemonSetSelector
  asserts: *frrDisabledAsserts

- it: omits the frr container for l2 load balancing on the production cluster
  values: *prodValues
  documentSelector: *daemonSetSelector
  asserts: *frrDisabledAsserts

- it: omits the frr sidecars and init containers on the local cluster
  values: *localValues
  documentSelector: *daemonSetSelector
  asserts: &frrSidecarsOmittedAsserts
  - notExists:
      path: spec.template.spec.containers[?(@.name=="reloader")]
  - notExists:
      path: spec.template.spec.containers[?(@.name=="frr-metrics")]
  - notExists:
      path: spec.template.spec.initContainers
  - notExists:
      path: spec.template.spec.volumes[?(@.name=="frr-startup")]

- it: omits the frr sidecars and init containers on the development cluster
  values: *devValues
  documentSelector: *daemonSetSelector
  asserts: *frrSidecarsOmittedAsserts

- it: omits the frr sidecars and init containers on the production cluster
  values: *prodValues
  documentSelector: *daemonSetSelector
  asserts: *frrSidecarsOmittedAsserts

- it: renders only the speaker daemonset without the frr startup configmap on the local cluster
  values: *localValues
  asserts: &frrStartupConfigMapOmittedAsserts
  - hasDocuments:
      count: 1
  - isKind:
      of: DaemonSet

- it: renders only the speaker daemonset without the frr startup configmap on the development cluster
  values: *devValues
  asserts: *frrStartupConfigMapOmittedAsserts

- it: renders only the speaker daemonset without the frr startup configmap on the production cluster
  values: *prodValues
  asserts: *frrStartupConfigMapOmittedAsserts
